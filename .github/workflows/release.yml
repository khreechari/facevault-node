name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create the GitHub release
  id-token: write   # npm publish --provenance (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # All third-party actions are SHA-pinned per supply-chain best practice;
      # the comment records the human-readable version next to each SHA.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      # IMPORTANT: do NOT set `registry-url` here. setup-node would generate
      # an .npmrc with `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`;
      # with no NODE_AUTH_TOKEN in env (the correct state for trusted
      # publishing), npm CLI sees an empty `_authToken=` and skips the
      # OIDC token exchange — the actual PUT then 404s anonymously even
      # though the provenance signing step succeeded.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test (with coverage gate)
        run: npm run test:coverage

      - name: Pack
        run: npm pack

      - name: SHA256 checksums
        run: |
          sha256sum *.tgz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Publish the [X.Y.Z] CHANGELOG section as the release body so the
      # public release page mirrors the in-repo changelog.
      - name: Extract changelog for this tag
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          VERSION="${VERSION#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-body.md
          echo "Body length: $(wc -c < release-body.md)"
          if [ ! -s release-body.md ]; then
            echo "WARNING: no CHANGELOG section found for $VERSION" >&2
          fi

      - name: Publish release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: |
            *.tgz
            SHA256SUMS.txt
          fail_on_unmatched_files: true
          body_path: release-body.md

      # Upgrade npm CLI before publish — Node 20 ships with npm 10.x, and
      # several trusted-publishing reliability fixes landed in npm 11.x.
      - name: Upgrade npm CLI
        run: |
          npm install -g npm@latest
          npm --version

      # Publish to npm via Trusted Publishing (OIDC). The `facevault` package
      # is configured on npmjs.com as having this repo + workflow as a trusted
      # publisher, so `npm publish` exchanges the workflow's OIDC token for a
      # scoped publish credential automatically — no stored token needed.
      # --provenance attests the supply chain.
      - name: Publish to npm
        run: npm publish --provenance --access public
